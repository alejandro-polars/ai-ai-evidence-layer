[project]
name = "ai-evidence-layer"
version = "0.1.0"
description = "Evidence layer for propfirm rule validation using Qwen2.5-7B-Instruct"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
train = [
    "unsloth[cu121-torch240] @ git+https://github.com/unslothai/unsloth.git",
    "trl>=0.9.0",
    "peft>=0.11.0",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.20.0",
    "transformers>=4.44.0",
]
eval = [
    "vllm>=0.6.0",
    "outlines>=0.0.46",
    "scikit-learn>=1.5",
]
deploy = [
    "huggingface-hub>=0.24",
]

[tool.setuptools.packages.find]
include = ["training*", "eval*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"
